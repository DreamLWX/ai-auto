{% extends "base.html" %}

{% block title %}登录 - AI-Todo Pro{% endblock %}

{% block body_class %}no-navbar{% endblock %}

{% block content %}
<style>
body {
    min-height: 100vh;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
}
.login-header {
    background: rgba(0,0,0,0.3);
    color: white;
    text-align: center;
    padding: 30px;
    font-size: 2.5rem;
    font-weight: bold;
    letter-spacing: 8px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}
.login-card {
    max-width: 400px;
    margin: 60px auto;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.login-card .card-body {
    padding: 40px;
}
.login-card .form-control {
    border-radius: 8px;
    padding: 12px 16px;
    border: 1px solid #e0e0e0;
    transition: all 0.3s;
}
.login-card .form-control:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
}
.login-card .btn-primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    transition: transform 0.2s, box-shadow 0.2s;
}
.login-card .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(102,126,234,0.4);
}
.login-card .card-title {
    color: #333;
    font-weight: 600;
    margin-bottom: 24px;
}
.login-card a {
    color: #667eea;
    text-decoration: none;
}
.login-card a:hover {
    text-decoration: underline;
}
</style>

<div class="login-header">TODO</div>

<div class="login-card bg-white">
    <div class="card-body">
        <h3 class="card-title text-center">登录</h3>
        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input type="text" class="form-control" id="username" name="username"
                       placeholder="请输入用户名" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input type="password" class="form-control" id="password" name="password"
                       placeholder="请输入密码" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">登录</button>
            </div>
        </form>
        <p class="text-center mt-3">
            还没有账号？<a href="{{ url_for('auth.register') }}">立即注册</a>
        </p>
        <p class="text-center mt-2">
            <a href="{{ url_for('auth.forgot_password') }}">忘记密码？</a>
        </p>
    </div>
</div>
{% endblock %}
